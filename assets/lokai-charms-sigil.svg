<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Lokai Charms Sigil</title>
  <desc id="desc">An ancient wisdom sigil with seven charms around an ocean current core.</desc>
  <defs>
